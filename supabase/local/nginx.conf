# Minimal API gateway emulating Supabase's routing for local development.
# Upstreams are resolved per request via Docker's DNS so recreating a service
# (e.g. `docker compose up -d auth`) doesn't leave the gateway pointing at a stale IP.
events {}
http {
  client_max_body_size 5m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8000;
    set $auth_upstream http://auth:9999;
    set $rest_upstream http://rest:3000;

    # CORS, matching hosted Supabase (browser clients call /auth/v1 directly).
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, range, accept-profile, content-profile" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Expose-Headers "content-range, x-total-count" always;
    if ($request_method = OPTIONS) { return 204; }
    location /auth/v1/ {
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $auth_upstream;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /rest/v1/ {
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $rest_upstream;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_set_header Host $host;
    }
    location = /health { return 200 'ok'; }
  }
}
